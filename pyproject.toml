[project]
name = "deep_agent_finance_demo"
version = "0.1.0"
description = "AML/KYC Financial Services Demo with LangSmith"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.0.40",
    "langgraph-cli>=0.0.20",
    "langsmith>=0.6.2",
    "pydantic>=2.5.0",
    "faker>=20.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "python-dateutil>=2.8.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "graphs", "load_generator", "utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
